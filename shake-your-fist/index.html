<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shake Your Fist</title>
<style>
/* Layout: one grayscale stage filling the frame, two quiet controls pinned bottom-right. Single light look by choice, to match the grayscale SVG set. */
:root{
  --ground:#e6e6e4; --stage:#f1f1ef; --ink:#2b2b2b; --mid:#8f8f8d; --soft:#d2d2d0;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--mono)}
.wrap{box-sizing:border-box;height:100%;padding:16px;display:flex}
.stage{position:relative;flex:1;min-width:0;background:var(--stage);border-radius:6px;overflow:hidden}
svg{display:block;width:100%;height:100%;touch-action:none;cursor:none;user-select:none;-webkit-user-select:none}
.tools{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
button{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--stage);border:1.5px solid var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
button:hover{background:var(--soft)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#night{opacity:0;transition:opacity 2.6s ease}
#sun{transition:transform 2.6s ease-in}
.isNight #night{opacity:1}
.isNight #sun{transform:translateY(90px)}
#cat{opacity:0;transform:translateY(90px)}
#cat.in{animation:hop .9s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes hop{0%{opacity:1;transform:translateY(90px)}55%{opacity:1;transform:translateY(-22px)}78%{opacity:1;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
#fx text{font-family:var(--mono);font-weight:700}
</style>

<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" aria-label="Alarm clock ringing at 6:18 with a clenched fist">
      <defs>
        <linearGradient id="gSun" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#333"/><stop offset=".55" stop-color="#8f8f8f"/><stop offset="1" stop-color="#e2e2e2"/>
        </linearGradient>
        <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#2e2e2e"/>
        </linearGradient>
        <clipPath id="pane"><rect x="0" y="0" width="220" height="200"/></clipPath>
        <g id="bell">
          <path d="M-28 0 A28 26 0 0 1 28 0 Z" fill="#d9d9d9" stroke="#2b2b2b" stroke-width="3.5"/>
          <rect x="-31" y="-2" width="62" height="7" rx="3" fill="#2b2b2b"/>
          <circle cy="-31" r="5.5" fill="#f1f1ef" stroke="#2b2b2b" stroke-width="3"/>
        </g>
      </defs>

      <g id="world">
        <!-- window frame + skies -->
        <g transform="translate(60 50)">
          <g clip-path="url(#pane)">
            <rect width="220" height="200" fill="url(#gSun)"/>
            <rect x="18" y="38" width="46" height="5" rx="2.5" fill="#8a8a8a"/>
            <rect x="26" y="52" width="30" height="5" rx="2.5" fill="#8a8a8a"/>
            <rect x="122" y="30" width="62" height="6" rx="3" fill="#7a7a7a"/>
            <circle id="sun" cx="150" cy="200" r="36" fill="#ececec" stroke="#9a9a9a" stroke-width="2"/>
            <g id="night">
              <rect width="220" height="200" fill="url(#gNight)"/>
              <g id="stars" fill="#e6e6e6"></g>
              <circle cx="150" cy="78" r="36" fill="#3a3a3a"/>
              <circle cx="150" cy="78" r="25" fill="#e4e4e4" stroke="#b5b5b5" stroke-width="2"/>
              <circle cx="142" cy="72" r="4" fill="#cdcdcd"/>
              <circle cx="157" cy="86" r="3" fill="#cdcdcd"/>
              <circle cx="156" cy="69" r="2" fill="#cdcdcd"/>
            </g>
          </g>
          <rect width="220" height="200" fill="none" stroke="#2b2b2b" stroke-width="3"/>
          <line x1="110" y1="0" x2="110" y2="200" stroke="#2b2b2b" stroke-width="3"/>
          <line x1="0" y1="100" x2="220" y2="100" stroke="#2b2b2b" stroke-width="3"/>
          <g transform="translate(168 200)">
            <g id="cat">
              <path d="M14 -10 C34 -8 32 -30 38 -42 C41 -49 47 -50 50 -45" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="0" cy="-24" rx="18" ry="25" fill="#111"/>
              <circle cx="0" cy="-58" r="15" fill="#111"/>
              <path d="M-14 -63 L-12 -84 L-3 -71 Z M14 -63 L12 -84 L3 -71 Z" fill="#111"/>
              <circle cx="-6" cy="-59" r="4.5" fill="#f2f2f2"/><circle cx="6" cy="-59" r="4.5" fill="#f2f2f2"/>
              <circle cx="-6" cy="-59" r="2" fill="#111"/><circle cx="6" cy="-59" r="2" fill="#111"/>
            </g>
          </g>
          <rect x="-12" y="200" width="244" height="9" fill="#6d6d6d" stroke="#2b2b2b" stroke-width="2.5"/>
        </g>

        <!-- alarm clock -->
        <g id="clock" transform="translate(560 300)">
          <g id="clockShake">
            <g id="rings" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round">
              <line x1="-98" y1="-102" x2="-110" y2="-113"/>
              <line x1="-84" y1="-116" x2="-89" y2="-131"/>
              <line x1="-104" y1="-84" x2="-121" y2="-86"/>
              <line x1="98" y1="-102" x2="110" y2="-113"/>
              <line x1="84" y1="-116" x2="89" y2="-131"/>
              <line x1="104" y1="-84" x2="121" y2="-86"/>
            </g>
            <use href="#bell" transform="translate(-56 -60) rotate(-24)"/>
            <use href="#bell" transform="translate(56 -60) rotate(24)"/>
            <rect x="-40" y="-72" width="80" height="16" rx="5" fill="#dcdcdc" stroke="#2b2b2b" stroke-width="3.5"/>
            <rect x="-62" y="50" width="22" height="13" rx="3" fill="#8a8a8a" stroke="#2b2b2b" stroke-width="3"/>
            <rect x="40" y="50" width="22" height="13" rx="3" fill="#8a8a8a" stroke="#2b2b2b" stroke-width="3"/>
            <rect x="-85" y="-58" width="170" height="114" rx="22" fill="#8a8a8a" stroke="#2b2b2b" stroke-width="4"/>
            <rect x="-65" y="-40" width="130" height="66" rx="8" fill="#2e2e2e" stroke="#2b2b2b" stroke-width="3"/>
            <text x="0" y="-6" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="36" fill="#e6e6e6" letter-spacing="2">6:18</text>
          </g>
        </g>

        <!-- arm -->
        <g id="arm">
          <rect id="armR" x="0" y="-22" width="200" height="44" rx="22" fill="#8a8a8a" stroke="#2b2b2b" stroke-width="3"/>
          <path id="armC" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- open hand -->
        <g id="hand">
          <g id="fingers">
            <rect x="-4" y="-27" width="48" height="12" rx="6" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
            <rect x="-4" y="-14" width="52" height="12" rx="6" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
            <rect x="-4" y="-1" width="49" height="12" rx="6" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
            <rect x="-4" y="12" width="40" height="12" rx="6" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
          </g>
          <rect x="-62" y="-30" width="18" height="60" rx="7" fill="#7c7c7c" stroke="#2b2b2b" stroke-width="3"/>
          <rect x="-46" y="-28" width="50" height="56" rx="14" fill="#c8c8c8" stroke="#2b2b2b" stroke-width="3.5"/>
          <rect x="-32" y="-48" width="32" height="12" rx="6" transform="rotate(-14 -16 -42)" fill="#c8c8c8" stroke="#2b2b2b" stroke-width="3"/>
        </g>

        <!-- fist -->
        <g id="fist" opacity="0">
          <rect x="-66" y="-36" width="22" height="72" rx="9" fill="#7c7c7c" stroke="#2b2b2b" stroke-width="3.5"/>
          <rect x="-46" y="-32" width="76" height="64" rx="18" fill="#c8c8c8" stroke="#2b2b2b" stroke-width="3.5"/>
          <circle cx="32" cy="-22" r="9.5" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
          <circle cx="34" cy="-7" r="9.5" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
          <circle cx="34" cy="8" r="9.5" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
          <circle cx="31" cy="23" r="9.5" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
          <rect x="-24" y="-5" width="48" height="13" rx="6.5" fill="#d4d4d4" stroke="#2b2b2b" stroke-width="3"/>
        </g>

        <g id="fx">
          <path id="prickles" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </svg>

    <div class="tools">
      <button id="reset" type="button">Reset</button>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('svg'), world = $('world'), fistEl = $('fist'), handEl = $('hand'), fingers = $('fingers');
  const armG = $('arm'), armR = $('armR'), armC = $('armC'), prick = $('prickles'), fx = $('fx');
  const clock = $('clock'), shake = $('clockShake'), rings = $('rings'), cat = $('cat');

  const CLOCK = { x: 560, y: 300 };
  const HOME = { x: 400, y: 330 };
  const MAXX = 370;          // fist can't reach the clock without the punch
  const NEED = 5;           // sharp direction changes to fill the rage
  const JIT = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.5 : 1;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
  const rnd = (a, b) => a + Math.random() * (b - a);
  const easeIO = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  // smooth tremble: layered sines instead of per-frame random jumps
  const wob = (t, f, seed) => Math.sin(t * f + seed) * .6 + Math.sin(t * f * 1.63 + seed * 2.1) * .4;
  const easeOutBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  // stars
  (() => {
    const g = $('stars'); let s = 7;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = 0; i < 22; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (r() * 210 + 5).toFixed(1));
      c.setAttribute('cy', (r() * 130 + 6).toFixed(1));
      c.setAttribute('r', (r() * 1.6 + .6).toFixed(1));
      g.appendChild(c);
    }
  })();

  // ---------- audio ----------
  let ac = null, out = null, soundOn = false;
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC(); out = ac.createGain(); out.gain.value = .6; out.connect(ac.destination);
  }
  function tone(type, f0, f1, dur, g, when = 0, filt = 0) {
    if (!soundOn || !ac) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(.0001, t);
    gn.gain.exponentialRampToValueAtTime(g, t + .008);
    gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let n = o;
    if (filt) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt; o.connect(f); n = f; }
    n.connect(gn); gn.connect(out); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, g, filt) {
    if (!soundOn || !ac) return;
    const t = ac.currentTime, len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = filt; gn.gain.value = g;
    src.connect(f); f.connect(gn); gn.connect(out); src.start(t);
  }
  setInterval(() => {
    if (S && !S.hit) { tone('square', 1900, 1900, .05, .06); tone('square', 1900, 1900, .05, .06, .09); }
  }, 210);
  function growl(r) {
    const g = .05 + r * .03;
    for (let i = 0; i < 4; i++) tone('sawtooth', 80 + r * 6 + (i % 2) * 14, 68 + r * 5, .07, g, i * .06, 550 + r * 110);
  }
  function thwack() { noise(.22, .9, 1500); tone('sine', 160, 38, .38, .9); tone('square', 90, 40, .12, .22, 0, 500); }
  function thud() { tone('sine', 95, 55, .2, .35, 0, 300); noise(.08, .12, 380); }

  function wakeAudio() {
    if (!ac) initAudio();
    if (ac) { soundOn = true; ac.resume(); }
  }

  // ---------- floating words ----------
  function spawnText(str, x, y, size, fill, dur, rise, rot = 0) {
    const t = document.createElementNS(NS, 'text');
    t.textContent = str;
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', size);
    t.setAttribute('fill', fill);
    fx.appendChild(t);
    S.texts.push({ el: t, x, y, t0: performance.now(), dur, rise, rot });
  }

  // ---------- state ----------
  let S = null, timers = [];
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    if (S) S.texts.forEach(o => o.el.remove());
    S = {
      phase: 'clench', t0: performance.now(), last: performance.now(),
      rage: 0, lastGain: 0, fist: { ...HOME }, target: null,
      contact: false, lastMove: 0, prevX: null, lastDir: 0, turnX: 0, turnTime: 0,
      missT0: 0, punchT0: 0, from: null, hit: false, hitT: 0, down: null, texts: []
    };
    svg.classList.remove('isNight');
    cat.classList.remove('in');
    clock.setAttribute('transform', `translate(${CLOCK.x} ${CLOCK.y})`);
    rings.style.display = '';
    fistEl.setAttribute('opacity', '0');
    handEl.setAttribute('opacity', '1');
    fingers.removeAttribute('transform');
    prick.setAttribute('d', '');
    world.removeAttribute('transform');
  }
  $('reset').addEventListener('click', reset);

  function gain(now) {
    S.rage = Math.floor(S.rage) + 1;
    S.lastGain = now;
    const word = S.rage < 2 ? 'grr' : S.rage < 4 ? 'grrr' : 'GRRR';
    spawnText(word, S.fist.x + rnd(-30, 30), S.fist.y - 62, 15 + S.rage * 6, '#2b2b2b', 700, 34, rnd(-14, 14));
    growl(S.rage);
    if (S.rage >= NEED) { S.phase = 'punch'; S.punchT0 = now; S.from = { ...S.fist }; S.missT0 = 0; }
  }

  function doHit(now) {
    S.hit = true; S.hitT = now;
    rings.style.display = 'none';
    spawnText('THWACK', 480, CLOCK.y - 70, 54, '#1c1c1c', 1200, 24, -6);
    thwack();
    timers.push(setTimeout(() => svg.classList.add('isNight'), 600));
    timers.push(setTimeout(() => cat.classList.add('in'), 2900));
  }

  // ---------- input ----------
  function pt(e) {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function makeContact(p, now) {
    S.contact = true;
    S.fist.x = Math.min(MAXX, p.x); S.fist.y = clamp(p.y, 70, 460);
    S.turnX = p.x; S.turnTime = now; S.prevX = p.x; S.lastDir = 0;
  }
  svg.addEventListener('pointermove', e => {
    const now = performance.now(), p = pt(e);
    S.target = p;
    if (S.phase !== 'ready') { S.prevX = p.x; return; }
    S.lastMove = now;
    if (!S.contact) { makeContact(p, now); return; }
    if (S.missT0) { S.prevX = p.x; return; }        // mid-swing: no progress
    const dx = p.x - S.prevX;
    if (Math.abs(dx) < 1.5) return;
    const dir = Math.sign(dx);
    if (S.lastDir && dir !== S.lastDir) {
      const amp = Math.abs(S.prevX - S.turnX);
      if (amp > 25 && now - S.turnTime < 900) gain(now);
      S.turnX = S.prevX; S.turnTime = now;
    }
    S.lastDir = dir; S.prevX = p.x;
  });
  svg.addEventListener('pointerdown', e => {
    wakeAudio();
    S.down = { t: performance.now(), x: e.clientX, y: e.clientY };
    try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  });
  svg.addEventListener('pointerup', e => {
    const now = performance.now(), d = S.down; S.down = null;
    if (!d || S.phase !== 'ready' || S.missT0) return;
    if (now - d.t < 240 && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10) {
      const p = pt(e);
      if (!S.contact) makeContact(p, now);
      S.target = p; S.lastMove = now; S.missT0 = now;
      spawnText('thud', S.fist.x + 90, S.fist.y + 40, 18, '#8f8f8d', 650, 10);
      thud();
    }
  });

  // ---------- render helpers ----------
  function drawArm(x, y) {
    const ex = x - 58, ey = y, sx = x - 300, sy = y + 90;
    const L = Math.hypot(ex - sx, ey - sy), a = Math.atan2(ey - sy, ex - sx) * 180 / Math.PI;
    armG.setAttribute('transform', `translate(${sx.toFixed(1)} ${sy.toFixed(1)}) rotate(${a.toFixed(2)})`);
    armR.setAttribute('width', (L + 14).toFixed(1));
    const c1 = (L * .62).toFixed(1), c2 = (L * .82).toFixed(1);
    armC.setAttribute('d', `M${c1} -15 q7 15 0 30 M${c2} -15 q7 15 0 30`);
  }
  function drawFist(x, y, rot) {
    fistEl.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);
    drawArm(x, y);
  }
  function drawPrickles(cx, cy, n, len) {
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-.25, .25);
      const r0 = 60 + rnd(0, 6), r1 = r0 + len * rnd(.6, 1.1);
      d += `M${(cx + Math.cos(a) * r0).toFixed(1)} ${(cy + Math.sin(a) * r0).toFixed(1)}L${(cx + Math.cos(a) * r1).toFixed(1)} ${(cy + Math.sin(a) * r1).toFixed(1)}`;
    }
    prick.setAttribute('d', d);
  }

  // ---------- loop ----------
  function frame(now) {
    const dt = Math.min(50, now - S.last); S.last = now;

    // clock: ringing, then knocked aside
    if (!S.hit) {
      const a = Math.sin(now / 18) * 3.5 * JIT, sx = Math.sin(now / 11) * 1.5 * JIT;
      shake.setAttribute('transform', `translate(${sx.toFixed(2)} 0) rotate(${a.toFixed(2)})`);
      rings.style.opacity = Math.random() > .3 ? 1 : .15;
    } else {
      const k = Math.min(1, (now - S.hitT) / 650), e = easeOutBack(k);
      shake.removeAttribute('transform');
      clock.setAttribute('transform', `translate(${(CLOCK.x + 130 * e).toFixed(1)} ${(CLOCK.y + 8 * e).toFixed(1)}) rotate(${(80 * e).toFixed(1)})`);
      const st = now - S.hitT;
      if (st < 320) {
        const m = (1 - st / 320) * 9 * JIT;
        world.setAttribute('transform', `translate(${rnd(-m, m).toFixed(1)} ${rnd(-m, m).toFixed(1)})`);
      } else world.removeAttribute('transform');
    }

    if (S.phase === 'clench') {
      const t = now - S.t0;
      const k = clamp((t - 600) / 1100, 0, 1);
      const amp = (.3 + k * 2.2) * JIT;
      fingers.setAttribute('transform', `scale(${(1 - .72 * easeIO(k)).toFixed(3)} 1)`);
      const x = HOME.x + amp * wob(now, .04, 0), y = HOME.y + amp * wob(now, .045, 3);
      handEl.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      drawArm(x, y);
      if (t > 1700) { S.phase = 'ready'; handEl.setAttribute('opacity', '0'); fistEl.setAttribute('opacity', '1'); }
    }

    else if (S.phase === 'ready') {
      if (now - S.lastGain > 2500 && S.rage > 0) S.rage = Math.max(0, S.rage - dt * .0004);
      const active = S.contact && S.target && now - S.lastMove < 1400;
      let bx, by, rot = 0;
      if (active) {
        const tx = Math.min(MAXX, S.target.x), ty = clamp(S.target.y, 70, 460);
        const fk = 1 - Math.pow(1 - .22, dt / 16.7);
        S.fist.x += (tx - S.fist.x) * fk; S.fist.y += (ty - S.fist.y) * fk;
        bx = S.fist.x; by = S.fist.y;
      } else {
        const ix = CLOCK.x - 210, iy = CLOCK.y;
        const ik = 1 - Math.pow(1 - .05, dt / 16.7);
        S.fist.x += (ix - S.fist.x) * ik; S.fist.y += (iy - S.fist.y) * ik;
        const ph = (now % 1100) / 1100;
        const jab = ph < .14 ? Math.sin(ph / .14 * Math.PI) * 42 : 0;   // jabs, stops short
        bx = S.fist.x + jab; by = S.fist.y;
      }
      if (S.missT0) {
        const k = (now - S.missT0) / 460;
        if (k < 1) {
          bx += Math.sin(k * Math.PI) * 74;
          by += Math.sin(k * Math.PI) * 34 * Math.min(1, k * 2);
          rot = Math.sin(k * Math.PI) * 22;
        } else S.missT0 = 0;
      }
      const amp = ((active ? 1.6 : 1) + S.rage * 2.1) * JIT;
      const f = .035 + S.rage * .006;
      drawFist(bx + amp * wob(now, f, 0), by + amp * wob(now, f * 1.17, 3), rot + amp * .6 * wob(now, f * .9, 6));
      if (active) drawPrickles(bx, by, 5 + Math.floor(S.rage * 4.5), 5 + S.rage * 3.6);
      else drawPrickles(bx, by, 3, 5);
    }

    else if (S.phase === 'punch') {
      const t = now - S.punchT0;
      const pull = { x: S.from.x - 70, y: S.from.y + 12 }, hitPt = { x: 432, y: CLOCK.y - 4 };
      let p, rot = 0, amp = 0;
      if (t < 280) {
        const k = easeIO(t / 280); p = lerp(S.from, pull, k); rot = -12 * k; amp = 9 * JIT;
        drawPrickles(p.x, p.y, 28, 24);
      } else if (t < 400) {
        let k = (t - 280) / 120; k = k * k; p = lerp(pull, hitPt, k); rot = -12 + 12 * k;
        prick.setAttribute('d', '');
      } else {
        if (!S.hit) doHit(now);
        if (t < 900) {
          p = { x: hitPt.x - 14 * Math.sin((t - 400) / 500 * Math.PI), y: hitPt.y };
        } else {
          const k = easeIO(Math.min(1, (t - 900) / 1100));
          p = { x: hitPt.x - 60 * k, y: hitPt.y + 330 * k };
          if (k >= 1) S.phase = 'done';
        }
      }
      drawFist(p.x + amp * wob(now, .09, 0), p.y + amp * wob(now, .1, 3), rot);
    }

    // floating words
    S.texts = S.texts.filter(o => {
      const k = (now - o.t0) / o.dur;
      if (k >= 1) { o.el.remove(); return false; }
      const pop = 1 + .35 * (1 - Math.min(1, k * 5));
      o.el.setAttribute('transform', `translate(${o.x.toFixed(1)} ${(o.y - o.rise * k).toFixed(1)}) rotate(${o.rot.toFixed(1)}) scale(${pop.toFixed(2)})`);
      o.el.setAttribute('opacity', (1 - k * k).toFixed(2));
      return true;
    });

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
