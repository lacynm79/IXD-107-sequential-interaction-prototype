<title>Slap the Alarm Quiet</title>
<style>
/* Layout: one fixed 800x600 stage scaled to fit; reset tucked in the corner. Single light grayscale world by choice. */
:root{--bg:#efefed;--ink:#222222;--soft:#d6d6d4;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);margin:0;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
#stage{position:absolute;left:0;top:0;width:800px;height:600px;transform-origin:0 0;overflow:hidden;cursor:default;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
#win{position:absolute;left:480px;top:50px;width:270px;height:225px}
#sky{position:absolute;left:18px;top:4px;width:233px;height:202px;overflow:hidden}
#sky img{width:100%;height:100%;object-fit:cover;left:0;top:0}
#sunset{opacity:0;will-change:opacity}
#stage.dusk #sunset{opacity:1;transition:opacity 1.5s cubic-bezier(.45,0,.25,1) .25s}
#stage.dusk #neighbor{transform:translateY(102%);transition:transform .55s cubic-bezier(.5,0,.75,0)}
#neighbor{will-change:transform}
#neighbor{width:130px;height:124px;left:52px;top:96px}
#frame{left:0;top:0;width:270px;height:225px}
#clock{position:absolute;left:140px;top:220px;width:320px;height:300px;transform-origin:50% 100%;cursor:pointer}
#clock img.part{pointer-events:auto}
#snooze{left:104px;top:92px;width:112px;height:44px}
#body{left:20px;top:100px;width:280px;height:200px}
.bell{top:46px;width:112px;height:92px;transform-origin:50% 87%}
#bellL{left:24px}#bellR{left:184px}
#lines{left:-20px;top:4px;width:360px;height:85px;opacity:1}
#arm{left:-67px;top:145px;width:309px;height:109px}
#hand{left:212px;top:130px;width:200px;height:117px}
#armhand{position:absolute;left:0;top:0;width:800px;height:600px;pointer-events:none}
#reset{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--soft);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
#reset:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>

<button id="reset" aria-label="Reset">&#8634;</button>
<script>
(()=>{
const $=id=>document.getElementById(id);
const stage=$('stage'),clock=$('clock'),armhand=$('armhand'),bellL=$('bellL'),bellR=$('bellR'),lines=$('lines'),snooze=$('snooze'),sunset=$('sunset'),neighbor=$('neighbor');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit(){const s=Math.min((innerWidth-32)/800,(innerHeight-32)/600);stage.style.transform=`translate(${(innerWidth-800*s)/2}px,${(innerHeight-600*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();

// rest shape after each slap: lower and softer
const REST=[1,.84,.71,.6,.42];
const RING=[1,.62,.4,.22,0];
const PALM_X=300, PALM_BOTTOM=240, BAR_TOP=102, CLOCK_BOTTOM=520, CLOCK_H=300;
const barTopAt=s=>CLOCK_BOTTOM-(CLOCK_H-BAR_TOP)*s;

let S;
function init(){
  S={hits:0,done:false,
    sy:{v:1,t:1,r:.1}, sx:{v:1,t:1,r:.1}, droop:{v:0,t:0,r:.1}, tilt:{v:0,t:0,r:.03},
    hy:{v:0,t:0,r:.1}, hx:{v:0,t:0,r:.1}, ring:{v:1,t:1,r:.05}, bar:{v:0,t:0,r:.1},
    timers:[], lastInput:performance.now(), contact:false, finale:0};
  stage.classList.remove('dusk');
}
init();
const set=(k,t,r)=>{S[k].t=t;if(r!=null)S[k].r=r;};
const later=(ms,fn)=>S.timers.push(setTimeout(fn,ms));
const clearTimers=()=>{S.timers.forEach(clearTimeout);S.timers=[];};

/* ---------- sound ---------- */
let A=null;
function audio(){
  if(A)return A;
  const C=new (window.AudioContext||window.webkitAudioContext)();
  const master=C.createGain();master.gain.value=.9;master.connect(C.destination);
  // bell: two metallic partials, chopped fast by a hammer LFO
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;lp.Q.value=.7;
  const ringGain=C.createGain();ringGain.gain.value=0;
  const chop=C.createGain();chop.gain.value=.5;
  const ham=C.createOscillator();ham.type='square';ham.frequency.value=22;
  const hamDepth=C.createGain();hamDepth.gain.value=.5;ham.connect(hamDepth).connect(chop.gain);
  const wob=C.createOscillator();wob.frequency.value=5;const wobDepth=C.createGain();wobDepth.gain.value=0;wob.connect(wobDepth);
  [1840,2710,4100].forEach((f,i)=>{const o=C.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;wobDepth.connect(o.detune);const g=C.createGain();g.gain.value=[.5,.3,.12][i];o.connect(g).connect(chop);o.start();});
  chop.connect(lp).connect(ringGain).connect(master);ham.start();wob.start();
  A={C,master,lp,ringGain,ham,wobDepth};
  return A;
}
function noise(C,dur){const b=C.createBuffer(1,C.sampleRate*dur,C.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=C.createBufferSource();s.buffer=b;return s;}
function thud(){
  if(!A)return;const {C,master}=A,t=C.currentTime;
  const o=C.createOscillator();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(38,t+.35);
  const g=C.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
  o.connect(g).connect(master);o.start(t);o.stop(t+.5);
  const n=noise(C,.4),f=C.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(120,t+.3);
  const ng=C.createGain();ng.gain.setValueAtTime(.35,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.35);
  n.connect(f).connect(ng).connect(master);n.start(t);
}
function smack(){
  if(!A)return;const {C,master}=A,t=C.currentTime;
  const n=noise(C,.06),f=C.createBiquadFilter();f.type='highpass';f.frequency.value=1800;
  const g=C.createGain();g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  n.connect(f).connect(g).connect(master);n.start(t);
}

/* ---------- input ---------- */
clock.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();audio();if(A.C.state==='suspended')A.C.resume();slap();});
stage.addEventListener('pointerdown',e=>{audio();if(A.C.state==='suspended')A.C.resume();miss(e);});

function slap(){
  if(S.done)return;
  S.lastInput=performance.now();clearTimers();
  S.hits++;const h=S.hits,last=h>=4;
  const rest=REST[h];
  // contact: sink in, squash, droop, cut the ring
  S.contact=true;
  const sc=last?REST[4]*.82:rest*.55;
  set('sy',sc,.35);set('sx',last?1.32:1.22,.35);set('droop',58,.35);set('bar',10,.35);set('ring',0,.6);
  set('hx',0,.3);set('hy',barTopAt(sc)+12-PALM_BOTTOM,.38);
  setTimeout(thud,40);
  if(last){S.done=true;}
  // during: slow peel, slow partial reshape, muffled return
  later(260,()=>{S.contact=false;set('hy',0,last?.012:.022);});
  later(380,()=>{
    set('sy',rest,last?.02:.03);set('sx',last?1.3:1+(1-rest)*.32,.03);
    set('droop',last?70:h*13,.025);set('bar',last?10:h*2,.03);set('tilt',last?6.5:h*1.8,.02);
  });
  if(!last) later(650,()=>set('ring',RING[h],.012));
  else later(450,()=>stage.classList.add('dusk'));
}

function miss(e){
  if(S.contact)return;
  S.lastInput=performance.now();
  const r=stage.getBoundingClientRect(),sc=r.width/800;
  const x=(e.clientX-r.left)/sc,y=(e.clientY-r.top)/sc;
  clearTimeoutMiss();
  set('hx',Math.max(-260,Math.min(420,x-PALM_X)),.45);set('hy',Math.max(-120,Math.min(330,y-PALM_BOTTOM)),.5);
  setTimeout(smack,70);
  missT=setTimeout(()=>{set('hx',0,.18);set('hy',0,.18);},150);
}
let missT=null;function clearTimeoutMiss(){clearTimeout(missT);}

$('reset').addEventListener('click',()=>{clearTimers();clearTimeoutMiss();init();});

/* ---------- frame loop ---------- */
const ease=o=>{o.v+=(o.t-o.v)*o.r;};
let t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  ['sy','sx','droop','tilt','hy','hx','ring','bar'].forEach(k=>ease(S[k]));
  const ring=S.ring.v, m=reduce?.25:1;

  // jitter: the clock shakes as hard as it rings
  const jx=(Math.random()-.5)*7*ring*m, jr=(Math.random()-.5)*3*ring*m;
  clock.style.transform=`translateX(${jx}px) rotate(${S.tilt.v+jr}deg) scale(${S.sx.v},${S.sy.v})`;
  const shake=Math.sin(t*95)*9*ring*m;
  bellL.style.transform=`rotate(${-20-S.droop.v+shake}deg) translateY(${S.droop.v*.35}px)`;
  bellR.style.transform=`rotate(${20+S.droop.v-shake}deg) translateY(${S.droop.v*.35}px)`;
  snooze.style.transform=`translateY(${S.bar.v}px)`;
  lines.style.opacity=Math.min(1,ring*1.3);
  lines.style.transform=`scale(${1+.05*Math.sin(t*40)*ring + (1-ring)*.08}) translateY(${(1-ring)*16}px)`;

  // idle pats: quick light taps that stop short of the clock
  let pat=0;
  if(!S.done&&!S.contact&&now-S.lastInput>1800&&Math.abs(S.hy.v)<4&&Math.abs(S.hx.v)<4){
    const ph=(t%1.5);if(ph<.6)pat=Math.abs(Math.sin(ph*Math.PI/.15))*15*m;
  }
  armhand.style.transform=`translate(${S.hx.v}px,${S.hy.v+pat}px)`;

  // completion: sky dims to sunset, neighbor sinks away

  if(A){
    const {C,lp,ringGain,ham,wobDepth}=A,ct=C.currentTime;
    ringGain.gain.setTargetAtTime(.16*ring,ct,.03);
    lp.frequency.setTargetAtTime(500+5500*Math.pow(ring,1.6),ct,.05);
    ham.frequency.setTargetAtTime(10+12*ring,ct,.1);
    wobDepth.gain.setTargetAtTime(S.hits*45*(ring>0?1:0),ct,.1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
