<html lang="en">
<head>

<body>

<main id="room">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-labelledby="stageLabel" role="img">
    <title id="stageLabel">A bedroom at night. Someone is asleep next to an alarm clock.</title>
    <defs>
      <!-- grayscale gingham for the blanket -->
      <pattern id="gingham" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <rect class="col-blanket" width="36" height="36" fill="#a9a9a9"/>
        <rect class="col-blanketCheck" width="18" height="36" fill="#8f8f8f" opacity=".55"/>
        <rect class="col-blanketCheck" width="36" height="18" fill="#8f8f8f" opacity=".55"/>
        <path d="M0 9h36M0 27h36" stroke="#c4c4c4" stroke-width="1.5" opacity=".6"/>
      </pattern>
      <pattern id="floorboards" width="160" height="140" patternUnits="userSpaceOnUse">
        <rect class="col-floor" width="160" height="140" fill="#d2d2d2"/>
        <rect x="0" y="0" width="60" height="46" fill="#fff" opacity=".05"/>
        <rect x="60" y="0" width="100" height="46" fill="#000" opacity=".05"/>
        <rect x="0" y="46" width="130" height="47" fill="#000" opacity=".03"/>
        <rect x="130" y="46" width="30" height="47" fill="#fff" opacity=".06"/>
        <rect x="30" y="93" width="130" height="47" fill="#fff" opacity=".04"/>
        <path d="M0 47.5h160M0 94.5h160" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
        <path d="M0 46h160M0 93h160M60 0v46M130 46v47M30 93v47" class="col-floorLine" stroke="#bcbcbc" stroke-width="3"/>
      </pattern>
      <!-- soft 3D look, kept cheap enough to animate: every shaded shape gets a gradient overlay
           (light from the upper left), and objects cast silhouette shadows (#shadows) -->
      <linearGradient id="shade" x1="0" y1="0" x2=".85" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
        <stop offset=".36" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".6" stop-color="#1d1a33" stop-opacity="0"/>
        <stop offset="1" stop-color="#1d1a33" stop-opacity=".3"/>
      </linearGradient>
      <radialGradient id="shadeRound" cx=".36" cy=".3" r=".85" fx=".32" fy=".26">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
        <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".72" stop-color="#1d1a33" stop-opacity="0"/>
        <stop offset="1" stop-color="#1d1a33" stop-opacity=".32"/>
      </radialGradient>
      <!-- a shadow is a copy of the object turned into a flat, see-through dark shape -->
      <filter id="sil" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 .11  0 0 0 0 .1  0 0 0 0 .2  0 0 0 .16 0"/>
      </filter>
      <radialGradient id="contactGrad">
        <stop offset="0" stop-color="#0d0b1e" stop-opacity=".42"/>
        <stop offset=".6" stop-color="#0d0b1e" stop-opacity=".16"/>
        <stop offset="1" stop-color="#0d0b1e" stop-opacity="0"/>
      </radialGradient>
      <!-- wall and floor shading -->
      <radialGradient id="wallShade" gradientUnits="userSpaceOnUse" cx="980" cy="330" r="1150">
        <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#0d0b1e" stop-opacity=".26"/>
      </radialGradient>
      <linearGradient id="wallFoot" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="752">
        <stop offset="0" stop-color="#0d0b1e" stop-opacity="0"/>
        <stop offset="1" stop-color="#0d0b1e" stop-opacity=".14"/>
      </linearGradient>
      <linearGradient id="floorShade" gradientUnits="userSpaceOnUse" x1="0" y1="764" x2="0" y2="1100">
        <stop offset="0" stop-color="#0d0b1e" stop-opacity=".38"/>
        <stop offset=".12" stop-color="#0d0b1e" stop-opacity=".08"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
        <stop offset="1" stop-color="#0d0b1e" stop-opacity=".3"/>
      </linearGradient>
      <radialGradient id="beamGrad" cx=".5" cy=".38" r=".6">
        <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
        <stop offset=".55" stop-color="#fff" stop-opacity=".18"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <!-- pale rim so the black cat reads against the night sky -->
      <filter id="catRim" x="-30%" y="-30%" width="160%" height="160%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.8" result="fat"/>
        <feFlood class="col-catRim" flood-color="#d9d9d9"/>
        <feComposite in2="fat" operator="in" result="rim"/>
        <feGaussianBlur in="rim" stdDeviation="2.2" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- clock parts (from the Slap study's SVG files), inlined so their colors can be tuned -->
      <g id="clockBodyArt" transform="scale(2)" data-shade="">
        <path class="col-clockFeet" d="M24 80 H38 L36 91 Q35 92 34 92 H28 Q27 92 26 91 Z" fill="#d9d9d9" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <path class="col-clockFeet" d="M102 80 H116 L114 91 Q113 92 112 92 H106 Q105 92 104 91 Z" fill="#d9d9d9" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <rect class="col-clockBody" x="12" y="8" width="116" height="76" rx="18" fill="#7a7a7a" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <rect x="17" y="13" width="106" height="66" rx="14" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="1"/>
        <rect class="col-screen" x="28" y="22" width="84" height="42" rx="5" fill="#2b2b2b" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M31 25 H70 L58 40 H31 Z" fill="#fff" opacity=".07"/>
        <circle cx="20" cy="46" r="1.6" fill="#000" opacity=".18"/><circle cx="120" cy="46" r="1.6" fill="#000" opacity=".18"/>
      </g>
      <g id="bellArt" transform="scale(2)" data-shade="">
        <line x1="28" y1="40" x2="28" y2="14" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
        <circle class="col-bell" cx="28" cy="10" r="3.6" fill="#e2e2e2" stroke="#222222" stroke-width="1.5"/>
        <path class="col-bell" d="M6,40 A22,22 0 0 1 50,40 Z" fill="#e2e2e2" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <rect class="col-bell" x="4" y="38" width="48" height="4.5" rx="2.2" fill="#e2e2e2" stroke="#222222" stroke-width="1.5"/>
        <path d="M14 30 A15 15 0 0 1 26 21" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="snoozeArt" transform="scale(2)" data-shade="">
        <rect class="col-snooze" x="6" y="5" width="44" height="13" rx="3" fill="#e2e2e2" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="12" y1="9.5" x2="44" y2="9.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>
      <linearGradient id="skyGradDawn" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradDay" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradSunset" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradNight" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <clipPath id="paneClip"><rect x="0" y="0" width="311" height="269"/></clipPath>
    </defs>

    <g id="shake">
    <g id="cam">
      <!-- room shell -->
      <rect class="col-wall" x="-3000" y="-3000" width="7600" height="3762" fill="#ececec"/>
      <rect x="-3000" y="760" width="7600" height="3000" fill="url(#floorboards)"/>
      <rect class="col-baseboard" data-shade="" x="-3000" y="752" width="7600" height="12" fill="#bdbdbd" stroke="#222" stroke-width="3"/>
      <g id="roomShade" class="look3d" pointer-events="none">
        <rect x="-3000" y="-3000" width="7600" height="3752" fill="url(#wallShade)"/>
        <rect x="-3000" y="560" width="7600" height="192" fill="url(#wallFoot)"/>
        <rect x="-3000" y="764" width="7600" height="3000" fill="url(#floorShade)"/>
        <!-- a soft glow of light from the window on the wall and floor below it (color set per time of day) -->
        <ellipse id="beam" cx="1080" cy="560" rx="330" ry="300" fill="url(#beamGrad)"/>
        <!-- contact shadows on the floor -->
        <ellipse id="bedContact" cx="415" cy="760" rx="215" ry="20" fill="url(#contactGrad)"/>
        <ellipse cx="722" cy="760" rx="165" ry="18" fill="url(#contactGrad)"/>
      </g>
      <!-- shadows cast on the wall: live copies of each object, offset down and to the right -->
      <g id="shadows" class="look3d" pointer-events="none">
        <g transform="translate(10 14)" filter="url(#sil)">
          <use href="#window"/><use href="#bed"/><use href="#nightstand"/><use href="#clock"/><use href="#arm"/><use href="#hand"/><use href="#fist"/><use href="#looseBell"/>
        </g>
      </g>

      <!-- window: four skies stacked, the cast lives inside the pane -->
      <g id="window" transform="translate(900 150)">
        <g transform="translate(24 5)" clip-path="url(#paneClip)">
          <!-- one layer per time of day: gradient, the study's artwork, then drawn extras (js/sky.js) -->
          <g id="skyDawn" data-tod="Dawn">
            <rect width="311" height="269" fill="url(#skyGradDawn)"/>
            <image class="art" href="assets/img/sky-dawn.png" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skyMidday" data-tod="Day" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradDay)"/>
            <image class="art" href="assets/img/sky-midday.png" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skySunset" data-tod="Sunset" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradSunset)"/>
            <image class="art" href="assets/img/sky-sunset.svg" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skyNight" data-tod="Night" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradNight)"/>
            <image class="art" href="assets/img/sky-night.svg" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="rooster" data-shade="">
            <!-- traced from the Sticky Snooze Bar rooster (assets/img/rooster.png) so each part can be recolored -->
            <g transform="translate(-55 -151) scale(0.33036)" stroke="#222" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
              <path class="col-roosterComb" d="M134 112 C116 74 140 48 160 58 C164 30 206 22 222 46 C240 22 288 30 288 64 C304 74 304 104 288 112 C250 96 176 96 134 112 Z" fill="#5e5e5e"/>
              <path class="col-roosterBody" d="M106 180 C98 260 92 370 119 432 L287 432 C270 372 262 300 258 180 Z" fill="#f2f2f2"/>
              <ellipse class="col-roosterBody" cx="182" cy="168" rx="82" ry="77" fill="#f2f2f2"/>
              <path class="col-roosterWattle" d="M104 202 C100 232 108 262 122 275 C136 256 140 226 130 206 Z" fill="#5e5e5e"/>
              <path class="col-roosterBeak" d="M100 150 L40 180 L102 193 Z" fill="#b4b4b4"/>
              <circle class="col-roosterEye" cx="156" cy="150" r="17" stroke-width="7" fill="#ffffff"/>
              <circle class="col-roosterPupil" cx="152" cy="150" r="8" fill="#222222" stroke="none"/>
            </g>
          </g>
          <g id="neighbor" data-shade="">
            <!-- traced from the Slap the Alarm Quiet neighbor (assets/img/neighbor.png) so each part can be recolored -->
            <g transform="translate(-79 -150) scale(0.31653)" stroke="#222" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
              <rect class="col-nbSkin" x="18" y="70" width="86" height="166" rx="43" transform="rotate(-11 61 153)" fill="#d0d0d0"/>
              <rect class="col-nbSkin" x="392" y="70" width="86" height="166" rx="43" transform="rotate(11 435 153)" fill="#d0d0d0"/>
              <path class="col-nbShirt" d="M92 465 L92 350 C92 300 140 266 200 266 L296 266 C356 266 404 300 404 350 L404 465 Z" fill="#8e8e8e"/>
              <circle class="col-nbSkin" cx="248" cy="151" r="115" fill="#d0d0d0"/>
              <path class="col-nbHair" d="M134 128 C130 40 190 9 249 9 C308 9 368 40 362 128 C330 50 168 50 134 128 Z" fill="#3c3c3c"/>
              <ellipse class="col-nbEyes" cx="208" cy="162" rx="17" ry="13" stroke-width="7" fill="#ffffff"/>
              <ellipse class="col-nbEyes" cx="288" cy="162" rx="17" ry="13" stroke-width="7" fill="#ffffff"/>
              <circle class="col-nbPupils" cx="206" cy="163" r="7" fill="#222222" stroke="none"/>
              <circle class="col-nbPupils" cx="286" cy="163" r="7" fill="#222222" stroke="none"/>
              <ellipse class="col-nbMouth" cx="248" cy="226" rx="13" ry="9" fill="#4a4a4a" stroke="none"/>
              <path d="M184 136 q22 -12 44 -4 M268 132 q22 -8 44 4" fill="none" stroke-width="8"/>
              <path d="M250 172 q-10 22 4 26" fill="none" stroke-width="6" stroke-opacity=".6"/>
            </g>
          </g>
          <g id="cat" filter="url(#catRim)"></g>
          <g id="windowFx"></g>
        </g>
        <!-- painted wooden frame (drawn as vectors so it can be shaded and recolored) -->
        <g id="winFrame" data-shade="">
          <path class="col-windowFrame" fill-rule="evenodd" d="M8 -10 H352 V284 H8 Z M24 5 V274 H335 V5 Z" fill="#f3f0ea" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
          <rect class="col-windowFrame" x="175" y="5" width="10" height="269" fill="#f3f0ea" stroke="#222" stroke-width="3"/>
          <rect class="col-windowFrame" x="24" y="134" width="311" height="10" fill="#f3f0ea" stroke="#222" stroke-width="3"/>
          <rect class="col-windowFrame" x="-8" y="274" width="376" height="24" rx="6" fill="#f3f0ea" stroke="#222" stroke-width="3"/>
        </g>
        <rect x="24" y="5" width="311" height="269" fill="none" stroke="#1d1a33" stroke-opacity=".25" stroke-width="6"/>
      </g>

      <!-- the wall the clock gets thrown into (from Throw the Clock) -->
      <g id="wall">
        <rect class="col-sideWall" x="1460" y="-3000" width="3000" height="6760" fill="#bcbcbc"/>
        <line x1="1466" y1="-3000" x2="1466" y2="3760" stroke="#222" stroke-width="3"/>
        <g id="wallCracks"></g>
      </g>

      <!-- bed, seen end-on: headboard at the back, the sleeper's head on the pillow facing us,
           the mattress running toward the viewer (the blanket is drawn later, in front of the arm) -->
      <g id="bed">
        <path class="col-headboard" data-shade="" d="M282 644 L282 452 Q282 424 310 420 Q415 398 520 420 Q548 424 548 452 L548 644 Z" fill="#8c8c8c" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M296 640 L296 456 Q296 436 316 433 Q415 413 514 433 Q534 436 534 456 L534 640" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
        <g fill="#000" opacity=".16"><circle cx="350" cy="462" r="3"/><circle cx="415" cy="452" r="3"/><circle cx="480" cy="462" r="3"/><circle cx="382" cy="500" r="3"/><circle cx="448" cy="500" r="3"/></g>
        <path class="col-sheet" data-shade="" d="M298 584 L532 584 L574 652 L256 652 Z" fill="#e2e2e2" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
        <rect class="col-bedBase" data-shade="" x="250" y="648" width="330" height="62" rx="6" fill="#9c9c9c" stroke="#222" stroke-width="2.5"/>
        <rect x="262" y="658" width="306" height="42" rx="3" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
        <path class="col-legs" data-shade="" d="M260 708 L286 708 L282 760 L265 760 Z" fill="#7a7a7a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="col-legs" data-shade="" d="M544 708 L570 708 L565 760 L548 760 Z" fill="#7a7a7a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="col-pillow" data-shade="" d="M322 566 C318 536 360 532 415 532 C470 532 512 536 508 566 C506 594 470 598 415 598 C360 598 324 594 322 566 Z" fill="#f2f2f2" stroke="#222" stroke-width="3"/>
        <!-- the sleeper's head, facing us; after rolling over only the back of the head shows -->
        <!-- the sleeper lies on their side facing the clock, so we see the back and side of the head:
             hair, an ear and the edge of the cheek, no face -->
        <g id="hair" data-shade="">
          <ellipse class="col-skin" cx="400" cy="552" rx="31" ry="34" fill="#d0d0d0" stroke="#222" stroke-width="2.5"/>
          <g id="sleepFace">
            <ellipse class="col-skin" cx="424" cy="557" rx="6" ry="9" fill="#d0d0d0" stroke="#222" stroke-width="2.2"/>
            <path d="M425 553 q-3 4 0 8" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.6" stroke-linecap="round"/>
          </g>
          <!-- hair covers the back and top of the head, leaving the cheek and ear on the clock side -->
          <path class="col-hair" d="M386 584 C370 576 366 556 369 540 C373 524 386 515 402 515 C419 515 430 524 431 538 C426 540 420 545 418 551 C422 544 416 534 408 532 C414 540 413 552 410 560 C406 572 398 582 386 584 Z" fill="#2b2b2b" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse id="backHair" class="col-hair" cx="400" cy="552" rx="32" ry="35" fill="#2b2b2b" stroke="#222" stroke-width="2.5" opacity="0"/>
          <path d="M380 532 q12 -10 30 -8 M376 552 q4 -12 14 -18" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- nightstand -->
      <g id="nightstand" data-shade="">
        <path class="col-legs" d="M614 740 L634 740 L630 760 L617 760 Z" fill="#7a7a7a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="col-legs" d="M810 740 L830 740 L827 760 L814 760 Z" fill="#7a7a7a" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
        <rect class="col-standBody" x="606" y="594" width="232" height="148" rx="3" fill="#8a8a8a" stroke="#222" stroke-width="2.5"/>
        <rect class="col-drawer" x="620" y="606" width="204" height="56" rx="4" fill="#9c9c9c" stroke="#222" stroke-width="2.5"/>
        <rect x="628" y="613" width="188" height="42" rx="2" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
        <rect class="col-drawer" x="620" y="672" width="204" height="56" rx="4" fill="#9c9c9c" stroke="#222" stroke-width="2.5"/>
        <rect x="628" y="679" width="188" height="42" rx="2" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="2"/>
        <circle class="col-knob" cx="722" cy="634" r="5" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
        <circle class="col-knob" cx="722" cy="700" r="5" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
        <rect class="col-standTop" x="590" y="578" width="264" height="18" rx="4" fill="#9a9a9a" stroke="#222" stroke-width="2.5"/>
        <path d="M596 590 H848" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="2"/>
      </g>

      <!-- alarm clock: local origin is the bottom centre, parts in the Slap study's 320x300 layout -->
      <g id="clock">
        <g id="clockRing">
          <g id="lines"><image href="assets/img/ring-lines.png" x="-180" y="-59.5" width="360" height="85"/></g>
        </g>
        <g id="bellL"><use href="#bellArt" x="-56" y="-80"/></g>
        <g id="bellR"><use href="#bellArt" x="-56" y="-80"/></g>
        <g id="bar"><use href="#snoozeArt" x="-56" y="-208"/></g>
        <use href="#clockBodyArt" x="-140" y="-200"/>
        <text id="display" x="0" y="-114" text-anchor="middle" dominant-baseline="central">5:59</text>
        <g id="clockCracks"></g>
      </g>
      <g id="looseBell" opacity="0"><use href="#bellArt" x="-56" y="-80"/></g>

      <!-- the sleeper's arm and hand (hand + fist drawings from Throw the Clock) -->
      <g id="arm">
        <!-- pajama sleeve: a rigid upper arm and forearm hinged at the elbow (js/scene.js). The outline is drawn
             as a wide stroke under the fill so the two segments join without a seam. -->
        <path id="armLine" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
        <path id="armShape" class="col-sleeve" fill="#8c8c8c"/>
        <path id="armHi" fill="none" stroke="#fff" stroke-opacity=".2" stroke-linecap="round" class="look3d"/>
        <path id="armCrease" fill="none" stroke="#6f6f6f" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="hand" data-shade="">
        <!-- back of the right hand (palm toward the wall), reaching to the right: thumb along the top,
             fingernails and knuckles showing -->
        <g transform="translate(32 40)">
          <!-- thumb: on the far side of the hand, lying forward along the index finger; only its top edge and tip show -->
