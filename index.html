<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Five More Minutes</title>
  <meta name="description" content="A sequential interaction prototype: snooze it, slap it, punch it, throw it.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20261020k">
</head>
<body>

<main id="room">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-labelledby="stageLabel" role="img">
    <title id="stageLabel">A bedroom at night. Someone is asleep next to an alarm clock.</title>
    <defs>
      <!-- grayscale gingham for the blanket -->
      <pattern id="gingham" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <rect class="col-blanket" width="36" height="36" fill="#a9a9a9"/>
        <rect class="col-blanketCheck" width="18" height="36" fill="#8f8f8f" opacity=".55"/>
        <rect class="col-blanketCheck" width="36" height="18" fill="#8f8f8f" opacity=".55"/>
        <path d="M0 9h36M0 27h36" stroke="#c4c4c4" stroke-width="1.5" opacity=".6"/>
      </pattern>
      <pattern id="floorboards" width="160" height="140" patternUnits="userSpaceOnUse">
        <rect class="col-floor" width="160" height="140" fill="#d2d2d2"/>
        <path d="M0 46h160M0 93h160M60 0v46M130 46v47M30 93v47" class="col-floorLine" stroke="#bcbcbc" stroke-width="3"/>
      </pattern>
      <!-- pale rim so the black cat reads against the night sky -->
      <filter id="catRim" x="-30%" y="-30%" width="160%" height="160%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.8" result="fat"/>
        <feFlood class="col-catRim" flood-color="#d9d9d9"/>
        <feComposite in2="fat" operator="in" result="rim"/>
        <feGaussianBlur in="rim" stdDeviation="2.2" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- clock parts (from the Slap study's SVG files), inlined so their colors can be tuned -->
      <g id="clockBodyArt" transform="scale(2)">
        <rect class="col-clockFeet" x="24" y="80" width="14" height="12" rx="2" fill="#d9d9d9" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
        <rect class="col-clockFeet" x="102" y="80" width="14" height="12" rx="2" fill="#d9d9d9" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
        <rect class="col-clockBody" x="12" y="8" width="116" height="76" rx="18" fill="#7a7a7a" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
        <rect class="col-screen" x="28" y="22" width="84" height="42" rx="5" fill="#2b2b2b" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g id="bellArt" transform="scale(2)">
        <line x1="28" y1="40" x2="28" y2="14" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
        <circle class="col-bell" cx="28" cy="10" r="4" fill="#e2e2e2" stroke="#222222" stroke-width="3"/>
        <path class="col-bell" d="M6,40 A22,22 0 0 1 50,40 Z" fill="#e2e2e2" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g id="snoozeArt" transform="scale(2)">
        <rect class="col-snooze" x="6" y="5" width="44" height="13" rx="3" fill="#e2e2e2" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
        <line x1="12" y1="9.5" x2="44" y2="9.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>
      <linearGradient id="skyGradDawn" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradDay" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradSunset" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <linearGradient id="skyGradNight" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" stop-color="#888"/><stop class="bottom" offset="1" stop-color="#ccc"/></linearGradient>
      <clipPath id="paneClip"><rect x="0" y="0" width="311" height="269"/></clipPath>
    </defs>

    <g id="shake">
    <g id="cam">
      <!-- room shell -->
      <rect class="col-wall" x="-3000" y="-3000" width="7600" height="3762" fill="#ececec"/>
      <rect x="-3000" y="760" width="7600" height="3000" fill="url(#floorboards)"/>
      <rect class="col-baseboard" x="-3000" y="752" width="7600" height="12" fill="#bdbdbd" stroke="#222" stroke-width="3"/>

      <!-- window: four skies stacked, the cast lives inside the pane -->
      <g id="window" transform="translate(900 150)">
        <g transform="translate(24 5)" clip-path="url(#paneClip)">
          <!-- one layer per time of day: gradient, the study's artwork, then drawn extras (js/sky.js) -->
          <g id="skyDawn" data-tod="Dawn">
            <rect width="311" height="269" fill="url(#skyGradDawn)"/>
            <image class="art" href="assets/img/sky-dawn.png" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skyMidday" data-tod="Day" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradDay)"/>
            <image class="art" href="assets/img/sky-midday.png" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skySunset" data-tod="Sunset" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradSunset)"/>
            <image class="art" href="assets/img/sky-sunset.svg" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="skyNight" data-tod="Night" opacity="0">
            <rect width="311" height="269" fill="url(#skyGradNight)"/>
            <image class="art" href="assets/img/sky-night.svg" width="311" height="269" preserveAspectRatio="xMidYMid slice"/>
            <g class="cel"></g>
          </g>
          <g id="rooster">
            <!-- traced from the Sticky Snooze Bar rooster (assets/img/rooster.png) so each part can be recolored -->
            <g transform="translate(-55 -151) scale(0.33036)" stroke="#222" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
              <path class="col-roosterComb" d="M134 112 C116 74 140 48 160 58 C164 30 206 22 222 46 C240 22 288 30 288 64 C304 74 304 104 288 112 C250 96 176 96 134 112 Z" fill="#5e5e5e"/>
              <path class="col-roosterBody" d="M106 180 C98 260 92 370 119 432 L287 432 C270 372 262 300 258 180 Z" fill="#f2f2f2"/>
              <ellipse class="col-roosterBody" cx="182" cy="168" rx="82" ry="77" fill="#f2f2f2"/>
              <path class="col-roosterWattle" d="M104 202 C100 232 108 262 122 275 C136 256 140 226 130 206 Z" fill="#5e5e5e"/>
              <path class="col-roosterBeak" d="M100 150 L40 180 L102 193 Z" fill="#b4b4b4"/>
              <circle class="col-roosterEye" cx="156" cy="150" r="31" stroke-width="12" fill="#ffffff"/>
              <circle class="col-roosterPupil" cx="148" cy="150" r="12.5" fill="#222222" stroke="none"/>
            </g>
          </g>
          <g id="neighbor">
            <!-- traced from the Slap the Alarm Quiet neighbor (assets/img/neighbor.png) so each part can be recolored -->
            <g transform="translate(-79 -150) scale(0.31653)" stroke="#222" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
              <rect class="col-nbSkin" x="18" y="70" width="86" height="166" rx="43" transform="rotate(-11 61 153)" fill="#d0d0d0"/>
              <rect class="col-nbSkin" x="392" y="70" width="86" height="166" rx="43" transform="rotate(11 435 153)" fill="#d0d0d0"/>
              <path class="col-nbShirt" d="M92 465 L92 350 C92 300 140 266 200 266 L296 266 C356 266 404 300 404 350 L404 465 Z" fill="#8e8e8e"/>
              <circle class="col-nbSkin" cx="248" cy="151" r="115" fill="#d0d0d0"/>
              <path class="col-nbHair" d="M134 128 C130 40 190 9 249 9 C308 9 368 40 362 128 C330 50 168 50 134 128 Z" fill="#3c3c3c"/>
              <ellipse class="col-nbEyes" cx="206" cy="159" rx="27.5" ry="31" stroke-width="12" fill="#ffffff"/>
              <ellipse class="col-nbEyes" cx="290" cy="159" rx="27.5" ry="31" stroke-width="12" fill="#ffffff"/>
              <circle class="col-nbPupils" cx="197" cy="165" r="12.5" fill="#222222" stroke="none"/>
              <circle class="col-nbPupils" cx="281" cy="165" r="12.5" fill="#222222" stroke="none"/>
              <ellipse class="col-nbMouth" cx="248" cy="231" rx="18" ry="14" fill="#4a4a4a" stroke="none"/>
            </g>
          </g>
          <g id="cat" filter="url(#catRim)"></g>
          <g id="windowFx"></g>
        </g>
        <image href="assets/img/window-frame.png" width="360" height="300"/>
      </g>

      <!-- the wall the clock gets thrown into (from Throw the Clock) -->
      <g id="wall">
        <rect class="col-sideWall" x="1460" y="-3000" width="3000" height="6760" fill="#bcbcbc"/>
        <line x1="1466" y1="-3000" x2="1466" y2="3760" stroke="#222" stroke-width="3"/>
        <g id="wallCracks"></g>
      </g>

      <!-- bed: headboard, frame, pillow, hair -->
      <g id="bed">
        <rect class="col-headboard" x="96" y="420" width="44" height="345" rx="10" fill="#8c8c8c" stroke="#222" stroke-width="3"/>
        <rect class="col-bedBase" x="128" y="592" width="486" height="112" rx="10" fill="#9c9c9c" stroke="#222" stroke-width="3"/>
        <rect class="col-legs" x="140" y="700" width="22" height="60" fill="#7a7a7a" stroke="#222" stroke-width="3"/>
        <rect class="col-legs" x="576" y="700" width="22" height="60" fill="#7a7a7a" stroke="#222" stroke-width="3"/>
        <rect class="col-sheet" x="128" y="572" width="490" height="36" rx="12" fill="#e2e2e2" stroke="#222" stroke-width="3"/>
        <path class="col-pillow" d="M172 560 C168 520 222 514 268 516 C320 518 344 528 340 560 C336 586 300 590 256 588 C206 586 176 584 172 560 Z" fill="#f2f2f2" stroke="#222" stroke-width="3"/>
        <g id="hair">
          <path d="M276 566 C266 540 286 522 312 526 C328 528 336 538 330 552 C340 548 346 556 340 566 Z" class="col-hair" fill="#2b2b2b" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
          <path d="M290 528 q-6 -14 6 -18 M306 526 q2 -16 14 -14 M322 532 q10 -10 18 -2" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <!-- nightstand -->
      <g id="nightstand">
        <rect class="col-standTop" x="596" y="600" width="252" height="22" rx="4" fill="#9a9a9a" stroke="#222" stroke-width="3"/>
        <rect class="col-standBody" x="610" y="620" width="224" height="124" fill="#8a8a8a" stroke="#222" stroke-width="3"/>
        <rect class="col-drawer" x="632" y="642" width="180" height="40" rx="4" fill="#9c9c9c" stroke="#222" stroke-width="3"/>
        <circle class="col-knob" cx="722" cy="662" r="6" fill="#d9d9d9" stroke="#222" stroke-width="3"/>
        <rect class="col-legs" x="616" y="742" width="18" height="18" fill="#7a7a7a" stroke="#222" stroke-width="3"/>
        <rect class="col-legs" x="810" y="742" width="18" height="18" fill="#7a7a7a" stroke="#222" stroke-width="3"/>
      </g>

      <!-- alarm clock: local origin is the bottom centre, parts in the Slap study's 320x300 layout -->
      <g id="clock">
        <g id="clockRing">
          <g id="lines"><image href="assets/img/ring-lines.png" x="-180" y="-59.5" width="360" height="85"/></g>
        </g>
        <g id="bellL"><use href="#bellArt" x="-56" y="-80"/></g>
        <g id="bellR"><use href="#bellArt" x="-56" y="-80"/></g>
        <g id="bar"><use href="#snoozeArt" x="-56" y="-208"/></g>
        <use href="#clockBodyArt" x="-140" y="-200"/>
        <text id="display" x="0" y="-114" text-anchor="middle" dominant-baseline="central">5:59</text>
        <g id="clockCracks"></g>
      </g>
      <g id="looseBell" opacity="0"><use href="#bellArt" x="-56" y="-80"/></g>

      <!-- the sleeper's arm and hand (hand + fist drawings from Throw the Clock) -->
      <g id="arm">
        <rect id="armRect" class="col-sleeve" x="0" y="-25" width="200" height="50" rx="25" fill="#8c8c8c" stroke="#222" stroke-width="3"/>
        <path id="armCrease" fill="none" stroke="#6f6f6f" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="hand">
        <g transform="translate(32 40)">
          <g id="fingers">
            <rect x="40" y="-22" width="44" height="11" rx="5.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
            <rect x="40" y="-11" width="46" height="11" rx="5.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
            <rect x="40" y="0" width="43" height="11" rx="5.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
            <rect x="40" y="11" width="36" height="11" rx="5.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          </g>
          <rect x="-6" y="-23" width="56" height="46" rx="15" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <rect x="16" y="-33" width="32" height="11" rx="5.5" transform="rotate(-14 16 -28)" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <rect x="-26" y="-26" width="20" height="52" rx="6" class="col-cuff" fill="#6f6f6f" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
      <g id="fist" opacity="0">
        <g transform="translate(30 32)">
          <rect x="-6" y="-25" width="58" height="50" rx="18" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <circle cx="50" cy="-16" r="8" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <circle cx="53" cy="-5" r="8" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <circle cx="53" cy="6" r="8" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <circle cx="49" cy="17" r="7.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <rect x="12" y="-7" width="36" height="11" rx="5.5" class="col-skin" fill="#d0d0d0" stroke="#222" stroke-width="3"/>
          <rect x="-24" y="-27" width="20" height="54" rx="6" class="col-cuff" fill="#6f6f6f" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- blanket sits in front of the arm so the arm comes out from under the covers -->
      <path id="blanket" fill="url(#gingham)" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <path id="blanketFold" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>

      <path id="prickles" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
      <g id="fx"></g>
    </g>
    </g>
  </svg>

  <!-- invisible target so the sequence can be played from a keyboard -->
  <button id="kbd" class="sr" aria-describedby="hint">Alarm clock</button>
  <p id="hint" class="sr" aria-live="polite"></p>
</main>

<div id="dark" aria-hidden="true"></div>

<!-- reset: a pull-chain bulb with a firefly circling it -->
<button id="bulb" type="button" aria-label="Reset: pull the light chain">
  <svg viewBox="0 0 120 230" aria-hidden="true">
    <defs>
      <radialGradient id="glow"><stop class="col-bulbGlow" offset="0" stop-color="#fff" stop-opacity=".95"/><stop class="col-bulbGlow" offset=".4" stop-color="#f4f4f4" stop-opacity=".55"/><stop class="col-bulbGlow" offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="bulbSwing">
      <line x1="60" y1="0" x2="60" y2="58" stroke="#222" stroke-width="3"/>
      <rect class="col-socket" x="49" y="56" width="22" height="20" rx="3" fill="#7a7a7a" stroke="#222" stroke-width="3"/>
      <circle id="bulbHalo" cx="60" cy="96" r="38" fill="url(#glow)" opacity=".35"/>
      <path id="bulbGlass" d="M50 76 C30 84 34 116 52 120 L68 120 C86 116 90 84 70 76 Z" fill="#f4f4f4" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <path d="M55 120 h10 M55 127 h10" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <g id="chain">
        <path id="chainLine" class="col-chain" d="M72 112 L72 176" stroke="#555" stroke-width="2.5" stroke-dasharray="3 3"/>
        <g id="chainBead">
          <circle class="col-resetTag" cx="72" cy="187" r="11" fill="#fff" stroke="#222" stroke-width="2.5"/>
          <path d="M78 187 a6 6 0 1 1 -1.76 -4.24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M76.7 178.2 l-0.46 4.56 l-4.5 -0.8" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <g id="firefly">
      <circle id="flyGlow" r="16" fill="url(#glow)" opacity=".5"/>
      <ellipse class="col-firefly" rx="5" ry="3.4" fill="#2b2b2b"/>
      <ellipse id="flyTail" cx="-5" rx="3.4" ry="3" fill="#f2f2f2" stroke="#222" stroke-width="1.5"/>
      <path id="flyWings" d="M0 -2 q-3 -9 -9 -6 M1 -2 q4 -9 9 -5" fill="none" class="col-wings" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </svg>
</button>

<script src="js/config.js?v=20261020k"></script>
<script src="js/audio.js?v=20261020k"></script>
<script src="js/scene.js?v=20261020k"></script>
<script src="js/rounds.js?v=20261020k"></script>
<script src="js/main.js?v=20261020k"></script>
<script src="js/sky.js?v=20261020k"></script>
<script src="js/versions.js?v=20261020k"></script>
<script src="js/panel.js?v=20261020k"></script>
</body>
</html>
