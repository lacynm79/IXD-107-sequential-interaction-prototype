<title>Sticky Snooze Bar</title>
<style>
  /* Layout: one centered stage, everything placed in % of the stage so it scales as a unit. Single grayscale look. */
  :root {
    --ground: #eeeeee;
    --ink: #222222;
    --paper: #ffffff;
    --mid: #7a7a7a;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding-inline: 16px;
    padding-block: 16px;
    box-sizing: border-box;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .stage {
    position: relative;
    width: min(100%, 540px, calc((100dvh - 64px) / 1.15));
    aspect-ratio: 1 / 1.15;
    max-width: 100%;
  }
  .stage img {
    position: absolute;
    display: block;
    max-width: none;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .layer { position: absolute; inset: 0; }

  /* Window */
  .window { position: absolute; left: 15%; top: 2%; width: 70%; aspect-ratio: 1200 / 1056; }
  .window .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene { position: absolute; left: 7.5%; top: 4.5%; width: 85%; height: 84%; overflow: hidden; }
  .scene .sky { position: relative; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 1.6s ease; }
  .scene .sky { position: absolute; }
  .scene .midday { opacity: 0; }
  .roosterWrap { position: absolute; left: 7%; bottom: 0; height: 56%; aspect-ratio: 336 / 456; transition: transform .8s cubic-bezier(.5,0,.75,0); }
  .stage:not(.day) .roosterWrap { transition: transform .9s cubic-bezier(.2,.8,.3,1); }
  .rooster { left: 0; bottom: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
  .neighbor { right: 6%; bottom: 0; height: 52%; transform: translateY(110%); transition: transform .9s cubic-bezier(.2,.8,.3,1) 0s; }
  .stage.day .midday { opacity: 1; }
  .stage.day .roosterWrap { transform: translateY(115%); }
  .stage.day .neighbor { transform: translateY(0); transition-delay: .9s; }

  /* Clock unit: bells and bar sit behind the body so the bar emerges from it */
  .unit { transform-origin: 50% 92.5%; will-change: transform; }
  .bell { width: 14%; top: 48%; transform-origin: 50% 95%; }
  .bell.l { left: 20%; }
  .bell.r { left: 66%; }
  .bar { left: 37%; width: 26%; top: 49%; will-change: transform; }
  .clock { left: 19%; width: 62%; top: 54%; }
  .lines { left: 4%; width: 92%; top: 40%; transform-origin: 50% 70%; }
  .hand { left: 34%; width: 24%; top: 32.8%; transform: rotate(50deg); will-change: transform; }

  .hit {
    position: absolute;
    left: 31%; width: 38%; top: 43%; height: 15%;
    background: transparent;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    border-radius: 14px;
  }
  .hit:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .stage.day .hit { cursor: default; }

  .reset {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: var(--paper);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .reset:hover { background: var(--ground); }
  .reset:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .reset svg { width: 22px; height: 22px; }
</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), unit = $('unit'), bar = $('bar'), hand = $('hand');
  const bellL = $('bellL'), bellR = $('bellR'), lines = $('lines'), rooster = $('rooster');
  const hit = $('hit'), resetBtn = $('reset');

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOTION = reduce ? 0.35 : 1;

  // Geometry in % of stage height
  const TRAVEL = 0.0535;   // bar travel from raised to flat
  const GAP = 0.025;       // hand hover gap above bar
  const BAR_TOP_FROM_BOTTOM = 0.925 - 0.49; // bar top above unit transform origin

  const CONTACT_MS = 90, CONTACT_DEPTH = 0.14, HOLD_MS = 1000;

  let H = 600;
  const measure = () => { H = stage.getBoundingClientRect().height; };
  measure();
  addEventListener('resize', measure);

  const S = {
    phase: 'ringing',    // ringing | pressing | releasing | done
    depth: 0,
    contact: 0,          // 0 hovering, 1 hand on bar
    ring: 1,
    t0: 0,
    from: 0,
    idleSince: performance.now(),
    doneAt: 0,
    squash: 0,
  };

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = x => 1 - Math.pow(1 - x, 2.2);
  const easeInOut = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const approach = (v, target, rate, dt) => v + (target - v) * (1 - Math.exp(-dt / rate));

  function press() {
    if (S.phase === 'done' || S.phase === 'pressing') return;
    // resume from wherever the bar currently is
    const start = S.depth;
    S.phase = 'pressing';
    S.t0 = performance.now();
    S.from = start;
    S.idleSince = S.t0;
  }
  function release() {
    if (S.phase !== 'pressing') return;
    S.phase = 'releasing';
    S.t0 = performance.now();
    S.from = S.depth;
    S.idleSince = S.t0;
  }
  function complete(t) {
    S.phase = 'done';
    S.depth = 1;
    S.doneAt = t;
    stage.classList.add('day');
  }
  function reset() {
    S.phase = 'ringing';
    S.depth = 0; S.contact = 0; S.ring = 1;
    S.idleSince = performance.now();
    stage.classList.remove('day');
  }

  hit.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { hit.setPointerCapture(e.pointerId); } catch (_) {}
    press();
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => hit.addEventListener(ev, release));
  hit.addEventListener('contextmenu', e => e.preventDefault());
  hit.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); }
  });
  hit.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); }
  });
  hit.addEventListener('blur', release);
  resetBtn.addEventListener('click', reset);
  addEventListener('pointermove', () => { if (S.phase === 'ringing') S.idleSince = performance.now(); });

  // Idle hint: hand presses partway, trembles, lifts
  function hint(t) {
    const idle = t - S.idleSince - 2600;
    if (idle < 0) return { d: 0, c: 0, shake: 0 };
    const c = idle % 2600;
    if (c < 500) { const p = easeInOut(c / 500); return { d: 0.2 * p, c: p, shake: 0 }; }
    if (c < 1150) { return { d: 0.2, c: 1, shake: 1 }; }
    if (c < 1750) { const p = 1 - easeInOut((c - 1150) / 600); return { d: 0.2 * p, c: p, shake: 0 }; }
    return { d: 0, c: 0, shake: 0 };
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(64, t - last); last = t;
    let tremble = 0, contactPulse = 0, clickDip = 0;

    if (S.phase === 'ringing') {
      const h = hint(t);
      S.depth = h.d;
      S.contact = h.c;
      tremble = h.shake * 1.6 * Math.sin(t * 0.09);
      S.ring = approach(S.ring, 1, 160, dt);
    }

    else if (S.phase === 'pressing') {
      const e = t - S.t0;
      let d;
      if (S.from < CONTACT_DEPTH && e < CONTACT_MS) {
        d = S.from + (CONTACT_DEPTH - S.from) * easeOut(e / CONTACT_MS);
        contactPulse = Math.sin(Math.PI * clamp(e / 220, 0, 1));
      } else {
        // slower the deeper it goes
        const base = Math.max(S.from, CONTACT_DEPTH);
        const span = HOLD_MS * (1 - (base - CONTACT_DEPTH) / (1 - CONTACT_DEPTH));
        const eStart = S.from < CONTACT_DEPTH ? CONTACT_MS : 0;
        const x = clamp((e - eStart) / Math.max(span, 1), 0, 1);
        d = base + (1 - base) * easeOut(x);
        if (e < 220) contactPulse = Math.sin(Math.PI * e / 220);
        tremble = (1 - x * 0.5) * 1.1 * Math.sin(t * 0.11) + 0.5 * Math.sin(t * 0.37);
        if (x >= 1) { complete(t); d = 1; }
      }
      S.depth = d;
      S.contact = approach(S.contact, 1, 25, dt);
      S.ring = approach(S.ring, 0, 45, dt);
    }

    else if (S.phase === 'releasing') {
      const dur = 700 + 1100 * S.from;
      const p = clamp((t - S.t0) / dur, 0, 1);
      S.depth = S.from * (1 - easeInOut(p));
      S.contact = approach(S.contact, 0, 80, dt);
      S.ring = Math.max(S.ring, easeInOut(p));
      if (p >= 1) { S.phase = 'ringing'; S.idleSince = t; }
    }

    else if (S.phase === 'done') {
      const e = t - S.doneAt;
      clickDip = 0.05 * Math.exp(-e / 70) * Math.cos(e / 30);
      S.depth = 1;
      S.contact = approach(S.contact, 0, 260, dt);
      S.ring = approach(S.ring, 0, 60, dt);
    }

    // Clock squash: brief on contact, slight compression with depth, damped settle on completion
    let squash = 0.035 * contactPulse + 0.008 * (S.phase === 'pressing' ? S.depth : 0);
    if (S.phase === 'done') {
      const e = t - S.doneAt;
      squash = 0.03 * Math.exp(-e / 160) * Math.cos(e / 55);
    }
    const sy = 1 - squash, sx = 1 + squash * 0.6;

    const r = S.ring * MOTION;
    const jitter = r * 1.6 * Math.sin(t * 0.13);
    unit.style.transform = `translateX(${jitter}px) scale(${sx}, ${sy})`;

    const swing = r * 11 * Math.sin(t * 0.065);
    bellL.style.transform = `rotate(${-16 + swing}deg)`;
    bellR.style.transform = `rotate(${16 - swing}deg)`;

    const flick = 0.5 + 0.5 * Math.abs(Math.sin(t * 0.018));
    lines.style.opacity = (S.ring * (0.45 + 0.55 * flick)).toFixed(3);
    lines.style.transform = `scale(${1 + 0.035 * r * Math.sin(t * 0.05)})`;

    rooster.style.transform = `rotate(${r * 3 * Math.sin(t * 0.02)}deg)`;

    const depthPx = (S.depth + clickDip) * TRAVEL * H;
    const barPx = depthPx + tremble * 0.6;
    bar.style.transform = `translateY(${barPx}px)`;

    // Hand follows the bar top through the unit's squash
    const squashShift = BAR_TOP_FROM_BOTTOM * H * (1 - sy);
    const hover = (1 - S.contact) * (GAP * H + (S.phase === 'ringing' ? 2 * Math.sin(t * 0.004) : 0));
    const handY = barPx * sy + squashShift + hover + tremble * 0.4;
    hand.style.transform = `translate(${jitter * 0.3 + tremble * 0.3}px, ${handY}px) rotate(50deg)`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
