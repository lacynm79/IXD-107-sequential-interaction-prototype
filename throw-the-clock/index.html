<title>Throw the Clock</title>
<style>
/* Layout: one full-bleed stage, wall on the right edge, single reset control bottom-left. Committed single grayscale look. */
:root{
  --ground:#d6d6d6;
  --ink:#222222;
  --btn:#d0d0d0;
  --btn-hover:#bdbdbd;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink)}
body{display:grid;place-items:center}
#stage{display:block;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;height:auto;background:#ececec;touch-action:none;-webkit-user-select:none;user-select:none}
#reset{
  position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--btn);
  display:grid;place-items:center;cursor:pointer;padding:0;
}
#reset:hover{background:var(--btn-hover)}
#reset:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#reset svg{width:22px;height:22px}
</style>

<canvas id="stage" aria-label="An alarm clock ringing at 11:27 next to a wall"></canvas>
<button id="reset" aria-label="Reset">

</button>

  rings:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="480" height="152"><g fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round"><path d="M40,30 l-14,-12 M32,52 l-20,-2 M54,14 l-6,-10"/><path d="M200,30 l14,-12 M208,52 l20,-2 M186,14 l6,-10"/></g></svg>`,
  snooze:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 22" width="112" height="44"><rect x="6" y="5" width="44" height="13" rx="3" fill="#e2e2e2" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="12" y1="9.5" x2="44" y2="9.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg>`,
  wall:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 220" width="140" height="440" preserveAspectRatio="none" overflow="hidden"><rect x="0" y="0" width="70" height="220" fill="#bcbcbc"/><line x1="4" y1="0" x2="4" y2="220" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`

const IMG = {};

const cv = document.getElementById('stage');

// ---------- update ----------

// ---------- draw ----------
function displayText() {

const CRACK = new Path2D('M78,72 l-18,-14 l-6,-18 M78,72 l-24,6 l-14,-6 l-10,8 M78,72 l-14,22 l4,18 M60,58 l-12,2 M54,78 l2,14 M78,72 l-30,-30');

function drawHand() {

  const hr = Math.max(-0.3, Math.min(0.3, Math.atan2(hand.y - sy, hand.x - sx) * 0.6));
  const ox = closed ? 60 : 70, oy = closed ? 56 : 63;      // grip point inside the SVG
  const cx0 = (16 - ox) * f, cy0 = ((closed ? 32 : 40) - oy) * f; // cuff center
  const wx = hand.x + cx0 * Math.cos(hr) - cy0 * Math.sin(hr);
  const wy = hand.y + cx0 * Math.sin(hr) + cy0 * Math.cos(hr);
  const aa = Math.atan2(sy - wy, sx - wx), len = Math.hypot(sx - wx, sy - wy) + 60 * f, th = 44 * f;
  ctx.save(); ctx.globalAlpha = hand.alpha;
  // arm: same capsule as arm.svg, lengthened (not stretched)
  ctx.save(); ctx.translate(wx, wy); ctx.rotate(aa);
  ctx.beginPath(); ctx.roundRect(0, -th / 2, len, th, th / 2);
  ctx.fillStyle = '#8c8c8c'; ctx.fill();
  ctx.lineWidth = 3 * f * 0.9; ctx.strokeStyle = '#222222'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath();
  for (const cx of [th * 0.9, th * 2.1]) { ctx.moveTo(cx, -th * 0.36); ctx.quadraticCurveTo(cx + th * 0.27, 0, cx, th * 0.36); }
  ctx.lineWidth = 2.5 * f * 0.9; ctx.strokeStyle = '#6f6f6f'; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
  ctx.translate(hand.x, hand.y); ctx.rotate(hr);
  if (closed) ctx.drawImage(IMG.fist, -ox * f, -oy * f, 96 * f, 64 * f);
  else ctx.drawImage(IMG.hand, -ox * f, -oy * f, 128 * f, 76 * f);
  ctx.restore();
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#ececec'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 18 * shake, (Math.random() - 0.5) * 12 * shake);
  ctx.drawImage(IMG.wall, wallX, -20, wallW + 20, H + 40);
  if (crack && crack.s > 0) {
    const k = 0.5 + 0.5 * crack.s;
    strokeCrack(crack.x, crack.y, -1.4 * u * k, 3.2 * u * k, 0, '#222222', 3 * u);
    strokeCrack(crack.x, crack.y, -1.1 * u * k, -2.4 * u * k, 0.2, '#222222', 2.4 * u);
  }
  drawClock();
  if (bellFx) { ctx.save(); ctx.translate(bellFx.x, bellFx.y); ctx.rotate(bellFx.r); ctx.drawImage(IMG.bell, -28 * u, -40 * u, 56 * u, 46 * u); ctx.restore(); }
  drawHand();
  ctx.restore();
}

let last = 0;
function frame(ts) {
  const now = ts / 1000, dt = Math.min(1 / 30, last ? now - last : 1 / 60);
  last = now; T += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function start() {
  layout(); resetAll();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  layout();
  if (state === 'idle') { c.x = rest.x; c.y = rest.y; }
  if (state === 'dead') { c.x = edgeX - 66 * u; c.y = floorY; if (crack) crack.x = edgeX; }
});
document.getElementById('reset').addEventListener('click', () => { resetAll(); });
})();
</script>
